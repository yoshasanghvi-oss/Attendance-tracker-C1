<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tetr Field Trip Attendance</title>
<style>
  :root{
    /* TETR BRAND COLORS -- best-effort approximation only.
       Tetr's public rebrand describes a primary green ("growth, focus,
       calm") plus a secondary pink/yellow/blue/purple palette, but no
       exact hex codes are published anywhere accessible. Swap the two
       blocks below for your official brand hex values when you have
       brand guidelines to reference. */
    --dep-color:#1F7A4D;      /* Tetr green -- Departure mode + "boarded" state */
    --dep-color-dark:#145C39;
    --dep-tint:#EAF6EF;
    --ret-color:#2554C7;      /* Secondary blue -- Return mode */
    --ret-color-dark:#1B3F99;
    --ret-tint:#EAF0FE;

    --mode-color:var(--dep-color);
    --mode-color-dark:var(--dep-color-dark);
    --mode-tint:var(--dep-tint);
    --missing:#DC2626;
    --missing-bg:#FEF2F2;
    --boarded:var(--dep-color);
    --boarded-bg:var(--dep-tint);
    --ink:#14171A;
    --muted:#6B7280;
    --line:#E7E9E8;
    --bg:#FFFFFF;
    --panel:#F6F7F6;

    --bus1-bg:#FEF3C7;   /* secondary yellow -- Bus 1 */
    --bus1-ink:#92400E;
    --bus2-bg:#F3E8FF;   /* secondary purple -- Bus 2 */
    --bus2-ink:#6B21A8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    padding-bottom:96px;
  }
  button, select, input, textarea{ font-family:inherit; }
  input, textarea{ user-select:text; -webkit-user-select:text; }

  /* ---------- Header ---------- */
  header{
    padding:20px 18px 16px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .logo-img{
    height:34px;
    width:auto;
    max-width:96px;
    flex:0 0 auto;
    object-fit:contain;
  }
  .brand-title{
    flex:1 1 auto;
    min-width:0;
    font-size:16px;
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:1.25;
  }
  .brand-title .sub{
    display:block;
    font-size:12.5px;
    font-weight:500;
    color:var(--muted);
    margin-top:1px;
  }
  .header-actions{
    display:flex;
    gap:6px;
    flex:0 0 auto;
  }
  .link-btn{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    font-size:11.5px;
    font-weight:700;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .link-btn:active{ background:var(--line); }

  select#tripSelect{
    width:100%;
    font-size:16px;
    font-weight:600;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
  }
  .trip-date{
    font-size:12.5px;
    color:var(--muted);
    margin-top:8px;
    padding-left:2px;
  }

  /* ---------- Bus toggle ---------- */
  .bus-toggle{
    display:flex;
    gap:4px;
    margin:14px 16px 0;
    background:var(--panel);
    border-radius:12px;
    padding:4px;
  }
  .bus-toggle button{
    flex:1;
    padding:9px 4px;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:0.02em;
    border:none;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .bus-toggle button.active{
    background:var(--bg);
    color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
  }
  .bus-toggle button.active[data-bus="1"]{ background:var(--bus1-bg); color:var(--bus1-ink); }
  .bus-toggle button.active[data-bus="2"]{ background:var(--bus2-bg); color:var(--bus2-ink); }

  /* ---------- Status card: mode toggle + headcount ---------- */
  .status-card{
    margin:14px 16px 0;
    padding:18px;
    border-radius:20px;
    background-color:var(--mode-tint);
    text-align:center;
    transition:background-color 0.2s ease;
  }
  .mode-toggle{
    display:flex;
    gap:4px;
    background:#ffffffb3;
    border-radius:12px;
    padding:4px;
    margin-bottom:18px;
  }
  .mode-toggle button{
    flex:1;
    padding:11px 6px;
    font-size:13.5px;
    font-weight:800;
    letter-spacing:0.04em;
    text-transform:uppercase;
    border:none;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .mode-toggle button.active{
    background:var(--mode-color);
    color:#fff;
  }
  .headcount .big{
    font-size:44px;
    font-weight:800;
    line-height:1;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  .headcount .label{
    font-size:12.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin-top:5px;
  }
  .missing-line{
    display:inline-block;
    margin-top:16px;
    padding:7px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    background:#ffffffb3;
    color:var(--muted);
  }
  .missing-line.has-missing{ color:var(--missing); }
  .missing-line.all-clear{ color:var(--dep-color); }

  /* ---------- Search + filters ---------- */
  .controls{
    margin:18px 16px 0;
  }
  .search-wrap{
    position:relative;
  }
  input#searchBox{
    width:100%;
    font-size:16px;
    padding:13px 40px 13px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
  }
  .clear-search{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    font-size:18px;
    color:var(--muted);
    padding:8px;
    cursor:pointer;
    display:none;
  }
  .filter-chips{
    display:flex;
    gap:4px;
    margin:16px 16px 0;
    border-bottom:1px solid var(--line);
  }
  .filter-chips button{
    flex:1;
    padding:11px 4px;
    margin-bottom:-1px;
    font-size:13.5px;
    font-weight:700;
    border:none;
    border-bottom:2px solid transparent;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .filter-chips button.active{
    color:var(--mode-color);
    border-bottom-color:var(--mode-color);
  }

  /* ---------- List ---------- */
  .list-wrap{
    margin:4px 0 0;
  }
  .section-header{
    display:flex;
    align-items:center;
    gap:7px;
    padding:18px 16px 8px;
    font-size:11px;
    font-weight:800;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .section-header::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
  }
  .section-header.missing::before{ background:var(--missing); }
  .section-header.boarded::before{ background:var(--boarded); }

  .student-row{
    width:100%;
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    min-height:56px;
  }
  .student-row.is-boarded{ background:var(--boarded-bg); }

  .row-toggle{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 8px 12px 16px;
    border:none;
    background:transparent;
    text-align:left;
    font-size:16px;
    cursor:pointer;
  }
  .check-icon{
    flex:0 0 26px;
    width:26px;
    height:26px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:900;
    color:transparent;
  }
  .student-row.is-boarded .check-icon{
    background:var(--boarded);
    border-color:var(--boarded);
    color:#fff;
  }
  .student-id{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:800;
    letter-spacing:0.02em;
    color:var(--muted);
    background:var(--panel);
    padding:4px 6px;
    border-radius:6px;
    white-space:nowrap;
  }
  .student-name{
    flex:1 1 auto;
    min-width:0;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .check-time{
    flex:0 0 auto;
    font-size:11.5px;
    color:var(--muted);
  }
  .bus-badge{
    flex:0 0 auto;
    width:44px;
    height:44px;
    margin-right:10px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    cursor:pointer;
  }
  .bus-badge.bus-1{ background:var(--bus1-bg); color:var(--bus1-ink); border-color:var(--bus1-bg); }
  .bus-badge.bus-2{ background:var(--bus2-bg); color:var(--bus2-ink); border-color:var(--bus2-bg); }

  .note-badge{
    flex:0 0 auto;
    width:44px;
    height:44px;
    margin-right:10px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .note-badge.note-sick{ background:var(--missing-bg); border-color:var(--missing-bg); }
  .note-badge.note-wait{ background:var(--bus1-bg); border-color:var(--bus1-bg); }
  .note-badge.note-other{ background:var(--ret-tint); border-color:var(--ret-tint); }

  .empty-state{
    padding:36px 20px;
    text-align:center;
    color:var(--muted);
    font-size:15px;
  }
  .no-trip{
    padding:48px 24px;
    text-align:center;
    color:var(--muted);
    font-size:15px;
  }

  /* ---------- Footer actions ---------- */
  .footer-actions{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    gap:8px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg);
    border-top:1px solid var(--line);
  }
  .footer-actions button{
    flex:1;
    padding:13px 4px;
    font-size:13.5px;
    font-weight:700;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
  }
  .footer-actions button.primary{
    background:var(--mode-color);
    border-color:var(--mode-color);
    color:#fff;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:104px;
    transform:translateX(-50%) translateY(20px);
    background:#14171A;
    color:#fff;
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    max-width:90vw;
    text-align:center;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ---------- History overlay ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:100;
    display:flex;
    flex-direction:column;
  }
  .overlay-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .overlay-title{
    font-size:17px;
    font-weight:700;
  }
  .overlay-subtitle-name{
    font-size:12.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .overlay-close{
    border:none;
    background:var(--panel);
    color:var(--muted);
    width:32px;
    height:32px;
    border-radius:50%;
    font-size:20px;
    line-height:1;
    cursor:pointer;
  }
  .overlay-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:18px;
  }

  .note-chips{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .note-chip{
    flex:1;
    padding:12px 4px;
    font-size:13.5px;
    font-weight:700;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
  }
  .note-chip:active{ background:var(--line); }
  .note-or{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin:4px 0 10px;
  }
  .note-textarea{
    width:100%;
    font-size:15px;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    resize:vertical;
  }
  .overlay-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .overlay-actions button{
    flex:1;
    padding:13px 4px;
    font-size:13.5px;
    font-weight:700;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
  }
  .overlay-actions button.primary{
    background:var(--dep-color);
    border-color:var(--dep-color);
    color:#fff;
  }

  .history-entry{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .history-entry:first-child{ padding-top:0; }
  .history-entry-title{
    font-size:15.5px;
    font-weight:700;
  }
  .history-entry-meta{
    font-size:13px;
    color:var(--muted);
    margin-top:3px;
  }
  .history-download{
    margin-top:10px;
    padding:9px 14px;
    font-size:13px;
    font-weight:700;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
  }
</style>
</head>

  /* ========================================================= */

  /* Immersion trip options. "date" is the scheduled date (YYYY-MM-DD)
     shown next to the trip name -- leave it null for trips that don't
     have a confirmed date yet. */
  const TRIPS = [
    { id: "google-hq-nyc",       name: "Google HQ NYC",      date: null },
    { id: "wall-street",         name: "Wall Street",        date: "2026-09-16" },
    { id: "brooklyn-navy-yard",  name: "Brooklyn Navy Yard", date: null },
    { id: "franklin-templeton",  name: "Franklin Templeton", date: null },
    { id: "jp-morgan",           name: "JP Morgan",          date: null },
    { id: "united-nations",      name: "United Nations",     date: "2026-09-04" },
    { id: "baseball-game",       name: "Baseball Game",      date: "2026-08-30" }
  ];

  const STORAGE_KEY = "tetr-attendance-tracker-v1";

  function todayISO(){
    const d = new Date();
    const pad = n => String(n).padStart(2,"0");
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }

  function formatDateDisplay(iso){
    if(!iso) return "";
    const parts = iso.split("-").map(Number);
    const dt = new Date(parts[0], parts[1] - 1, parts[2]);
    return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function loadStore(){
    let s = null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) s = JSON.parse(raw);
    }catch(e){}
    if(!s || typeof s !== "object") s = {};
    if(!s.trips || typeof s.trips !== "object") s.trips = {};
    if(!Array.isArray(s.history)) s.history = [];
    if(typeof s.lastTripId !== "string") s.lastTripId = "";
    if(s.lastMode !== "return" && s.lastMode !== "departure") s.lastMode = "departure";
    return s;
  }

  function saveStore(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }catch(e){
      showToast("Could not save -- storage unavailable");
    }
  }

  function blankStudentRecord(){
    return { departure:false, departureTime:null, return:false, returnTime:null, bus:null, note:"" };
  }

  function freshTripRecord(){
    const students = {};
    STUDENTS.forEach(s => { students[s.id] = blankStudentRecord(); });
    return { date: todayISO(), students };
  }

  let store = loadStore();
  let currentTripId = store.lastTripId || "";
  let currentMode = store.lastMode === "return" ? "return" : "departure";
  let currentFilter = "all";
  let currentBus = "all";
  let searchTerm = "";
  let noteEditingId = null;

  /* ---------- DOM refs ---------- */
  const tripSelect = document.getElementById("tripSelect");
  const tripDateLabel = document.getElementById("tripDateLabel");
  const appEl = document.getElementById("app");
  const noTripMsg = document.getElementById("noTripMsg");
  const footerActions = document.getElementById("footerActions");
  const busToggle = document.getElementById("busToggle");
  const busToggleButtons = document.querySelectorAll(".bus-toggle button");
  const modeDepartureBtn = document.getElementById("modeDepartureBtn");
  const modeReturnBtn = document.getElementById("modeReturnBtn");
  const headcountBig = document.getElementById("headcountBig");
  const headcountLabel = document.getElementById("headcountLabel");
  const missingLine = document.getElementById("missingLine");
  const searchBox = document.getElementById("searchBox");
  const clearSearchBtn = document.getElementById("clearSearchBtn");
  const listWrap = document.getElementById("listWrap");
  const filterChips = document.querySelectorAll(".filter-chips button");
  const toastEl = document.getElementById("toast");

  const historyBtn = document.getElementById("historyBtn");
  const historyOverlay = document.getElementById("historyOverlay");
  const closeHistoryBtn = document.getElementById("closeHistoryBtn");
  const historyList = document.getElementById("historyList");

  const noteOverlay = document.getElementById("noteOverlay");
  const closeNoteBtn = document.getElementById("closeNoteBtn");
  const noteStudentName = document.getElementById("noteStudentName");
  const noteChipSick = document.getElementById("noteChipSick");
  const noteChipNotArrived = document.getElementById("noteChipNotArrived");
  const noteTextInput = document.getElementById("noteTextInput");
  const noteSaveBtn = document.getElementById("noteSaveBtn");
  const noteClearBtn = document.getElementById("noteClearBtn");

  /* ---------- Trip selector setup ---------- */
  TRIPS.forEach(trip => {
    const opt = document.createElement("option");
    opt.value = trip.id;
    opt.textContent = trip.date ? (trip.name + " -- " + formatDateDisplay(trip.date)) : trip.name;
    tripSelect.appendChild(opt);
  });
  tripSelect.value = currentTripId;

  function getTripMeta(id){
    return TRIPS.find(t => t.id === id);
  }

  function getTripRecord(id){
    if(!store.trips[id]){
      store.trips[id] = freshTripRecord();
    }
    const record = store.trips[id];
    // Self-heal: fill in any roster ids missing from this trip's record
    // (e.g. the roster array was edited in code after this trip was
    // first opened) without touching existing check-in data.
    STUDENTS.forEach(s => {
      if(!record.students[s.id]){
        record.students[s.id] = blankStudentRecord();
      }
    });
    return record;
  }

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  /* ---------- Overlays ---------- */
  function openOverlay(el){
    el.style.display = "flex";
    document.body.style.overflow = "hidden";
  }
  function closeOverlay(el){
    el.style.display = "none";
    document.body.style.overflow = "";
  }

  /* ---------- Mode ---------- */
  function applyModeColors(){
    const root = document.documentElement.style;
    if(currentMode === "departure"){
      root.setProperty("--mode-color", "var(--dep-color)");
      root.setProperty("--mode-color-dark", "var(--dep-color-dark)");
      root.setProperty("--mode-tint", "var(--dep-tint)");
    }else{
      root.setProperty("--mode-color", "var(--ret-color)");
      root.setProperty("--mode-color-dark", "var(--ret-color-dark)");
      root.setProperty("--mode-tint", "var(--ret-tint)");
    }
    modeDepartureBtn.classList.toggle("active", currentMode === "departure");
    modeReturnBtn.classList.toggle("active", currentMode === "return");
  }

  function setMode(mode){
    currentMode = mode;
    store.lastMode = mode;
    saveStore();
    applyModeColors();
    render();
  }

  /* ---------- Rendering ---------- */
  function render(){
    if(!currentTripId){
      appEl.style.display = "none";
      footerActions.style.display = "none";
      noTripMsg.style.display = "block";
      tripDateLabel.textContent = "";
      return;
    }
    appEl.style.display = "block";
    footerActions.style.display = "flex";
    noTripMsg.style.display = "none";

    const meta = getTripMeta(currentTripId);
    const record = getTripRecord(currentTripId);
    tripDateLabel.textContent = meta.name + " -- " + formatDateDisplay(meta.date || record.date);

    const key = currentMode; // "departure" | "return"
    const timeKey = currentMode + "Time";

    // Bus scoping: "All Buses" shows everyone. A specific bus shows that
    // bus's assigned students plus anyone not yet assigned, so nobody
    // silently disappears from view before they've been sorted onto a bus.
    let scoped = STUDENTS;
    if(currentBus !== "all"){
      const busNum = Number(currentBus);
      scoped = STUDENTS.filter(s => {
        const b = record.students[s.id].bus;
        return !b || b === busNum;
      });
    }

    const total = scoped.length;
    let boardedCount = 0;
    scoped.forEach(s => { if(record.students[s.id][key]) boardedCount++; });
    const missingCount = total - boardedCount;

    headcountBig.textContent = boardedCount + " / " + total;
    headcountLabel.textContent = "boarded for " + (currentMode === "departure" ? "departure" : "return");

    if(missingCount === 0){
      missingLine.textContent = "All students accounted for";
      missingLine.classList.remove("has-missing");
      missingLine.classList.add("all-clear");
    }else{
      missingLine.textContent = missingCount + " missing";
      missingLine.classList.remove("all-clear");
      missingLine.classList.add("has-missing");
    }

    // Build filtered + sorted student list within the bus scope
    const term = searchTerm.trim().toLowerCase();
    let list = scoped.filter(s => !term || s.name.toLowerCase().includes(term) || s.id.toLowerCase().includes(term));
    list.sort((a,b) => a.name.localeCompare(b.name));

    const missingList = list.filter(s => !record.students[s.id][key]);
    const boardedList = list.filter(s => record.students[s.id][key]);

    listWrap.innerHTML = "";

    if(list.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No students match \"" + searchTerm + "\"";
      listWrap.appendChild(empty);
      return;
    }

    function appendRow(s){
      const srec = record.students[s.id];
      const rec = srec[key];
      const time = srec[timeKey];
      const busVal = srec.bus || null;
      const busClass = busVal ? (" bus-" + busVal) : "";
      const busLabel = busVal === 1 ? "B1" : busVal === 2 ? "B2" : "--";
      const noteVal = srec.note || "";
      let noteClass = "", noteLabel = "+";
      if(noteVal === "Sick"){ noteClass = " note-sick"; noteLabel = "🤒"; }
      else if(noteVal === "Not arrived yet"){ noteClass = " note-wait"; noteLabel = "⏳"; }
      else if(noteVal){ noteClass = " note-other"; noteLabel = "📝"; }
      const row = document.createElement("div");
      row.className = "student-row" + (rec ? " is-boarded" : "");
      row.innerHTML =
        '<button type="button" class="row-toggle" data-id="' + escapeHtml(s.id) + '">' +
          '<span class="check-icon">' + (rec ? "&#10003;" : "") + '</span>' +
          '<span class="student-id">' + escapeHtml(s.id) + '</span>' +
          '<span class="student-name">' + escapeHtml(s.name) + '</span>' +
          '<span class="check-time">' + (time ? escapeHtml(time) : "") + '</span>' +
        '</button>' +
        '<button type="button" class="note-badge' + noteClass + '" data-id="' + escapeHtml(s.id) + '" title="' + (noteVal ? escapeHtml(noteVal) : "Add a note") + '">' + noteLabel + '</button>' +
        '<button type="button" class="bus-badge' + busClass + '" data-id="' + escapeHtml(s.id) + '" title="Tap to set bus">' + busLabel + '</button>';
      listWrap.appendChild(row);
    }

    if(currentFilter === "missing"){
      if(missingList.length === 0){
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Nobody missing for " + currentMode + (term ? " matching search" : "");
        listWrap.appendChild(empty);
      }else{
        missingList.forEach(appendRow);
      }
    }else if(currentFilter === "boarded"){
      if(boardedList.length === 0){
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Nobody boarded yet";
        listWrap.appendChild(empty);
      }else{
        boardedList.forEach(appendRow);
      }
    }else{
      if(missingList.length){
        const h = document.createElement("div");
        h.className = "section-header missing";
        h.textContent = "MISSING (" + missingList.length + ")";
        listWrap.appendChild(h);
        missingList.forEach(appendRow);
      }
      if(boardedList.length){
        const h = document.createElement("div");
        h.className = "section-header boarded";
        h.textContent = "BOARDED (" + boardedList.length + ")";
        listWrap.appendChild(h);
        boardedList.forEach(appendRow);
      }
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  /* ---------- Toggle check-in ---------- */
  // Tapping any row -- including rows sitting in the MISSING section --
  // flips them straight to present. That's the fix for "boarded/missing
  // by mistake": there's no separate undo control, the row is the toggle.
  function toggleStudent(id){
    const record = getTripRecord(currentTripId);
    const key = currentMode;
    const timeKey = currentMode + "Time";
    const rec = record.students[id];
    rec[key] = !rec[key];
    rec[timeKey] = rec[key] ? new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : null;
    saveStore();
    render();
  }

  /* ---------- Cycle bus assignment ---------- */
  function cycleBus(id){
    const record = getTripRecord(currentTripId);
    const rec = record.students[id];
    const order = [null, 1, 2];
    const idx = order.indexOf(rec.bus || null);
    rec.bus = order[(idx + 1) % order.length];
    saveStore();
    render();
  }

  /* ---------- Event wiring ---------- */
  tripSelect.addEventListener("change", () => {
    currentTripId = tripSelect.value;
    store.lastTripId = currentTripId;
    currentBus = "all";
    busToggleButtons.forEach(b => b.classList.toggle("active", b.dataset.bus === "all"));
    saveStore();
    render();
  });

  busToggleButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      busToggleButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentBus = btn.dataset.bus;
      render();
    });
  });

  modeDepartureBtn.addEventListener("click", () => setMode("departure"));
  modeReturnBtn.addEventListener("click", () => setMode("return"));

  searchBox.addEventListener("input", () => {
    searchTerm = searchBox.value;
    clearSearchBtn.style.display = searchTerm ? "block" : "none";
    render();
  });
  clearSearchBtn.addEventListener("click", () => {
    searchBox.value = "";
    searchTerm = "";
    clearSearchBtn.style.display = "none";
    render();
    searchBox.focus();
  });

  filterChips.forEach(btn => {
    btn.addEventListener("click", () => {
      filterChips.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  listWrap.addEventListener("click", (e) => {
    const noteBtn = e.target.closest(".note-badge");
    if(noteBtn){
      openNoteEditor(noteBtn.dataset.id);
      return;
    }
    const busBtn = e.target.closest(".bus-badge");
    if(busBtn){
      cycleBus(busBtn.dataset.id);
      return;
    }
    const toggleBtn = e.target.closest(".row-toggle");
    if(toggleBtn){
      toggleStudent(toggleBtn.dataset.id);
    }
  });

  /* ---------- Attendance note editor ---------- */
  function openNoteEditor(id){
    if(!currentTripId) return;
    const record = getTripRecord(currentTripId);
    const s = STUDENTS.find(st => st.id === id);
    if(!s) return;
    noteEditingId = id;
    noteStudentName.textContent = s.name;
    noteTextInput.value = record.students[id].note || "";
    openOverlay(noteOverlay);
  }

  function saveNoteAndClose(text){
    if(!noteEditingId) return;
    const record = getTripRecord(currentTripId);
    record.students[noteEditingId].note = text.trim();
    saveStore();
    closeOverlay(noteOverlay);
    noteEditingId = null;
    render();
  }

  noteChipSick.addEventListener("click", () => saveNoteAndClose("Sick"));
  noteChipNotArrived.addEventListener("click", () => saveNoteAndClose("Not arrived yet"));
  noteSaveBtn.addEventListener("click", () => saveNoteAndClose(noteTextInput.value));
  noteClearBtn.addEventListener("click", () => saveNoteAndClose(""));
  closeNoteBtn.addEventListener("click", () => {
    closeOverlay(noteOverlay);
    noteEditingId = null;
  });

  /* ---------- CSV export (shared by live download + History) ---------- */
  function csvField(v){
    const s = String(v == null ? "" : v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function buildCsvBlob(roster, studentsData){
    const sorted = roster.slice().sort((a,b) => a.name.localeCompare(b.name));
    const rows = [["Student ID","Student Name","Bus","Departure (Yes/No)","Departure Time","Return (Yes/No)","Return Time","Note"]];
    sorted.forEach(s => {
      const rec = studentsData[s.id] || blankStudentRecord();
      rows.push([
        s.id,
        s.name,
        rec.bus ? ("Bus " + rec.bus) : "",
        rec.departure ? "Yes" : "No",
        rec.departureTime || "",
        rec.return ? "Yes" : "No",
        rec.returnTime || "",
        rec.note || ""
      ]);
    });
    const csv = "﻿" + rows.map(r => r.map(csvField).join(",")).join("\r\n");
    return new Blob([csv], { type: "text/csv;charset=utf-8;" });
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.getElementById("downloadCsvBtn").addEventListener("click", () => {
    if(!currentTripId) return;
    const meta = getTripMeta(currentTripId);
    const record = getTripRecord(currentTripId);
    const blob = buildCsvBlob(STUDENTS, record.students);
    const filename = meta.name.replace(/\s+/g,"-") + "-" + (meta.date || record.date) + "-attendance.csv";
    downloadBlob(blob, filename);
    showToast("Downloaded " + filename);
  });

  /* ---------- Copy summary ---------- */
  document.getElementById("copyBtn").addEventListener("click", () => {
    if(!currentTripId) return;
    const meta = getTripMeta(currentTripId);
    const record = getTripRecord(currentTripId);
    const roster = STUDENTS.slice().sort((a,b) => a.name.localeCompare(b.name));

    const depBoarded = roster.filter(s => record.students[s.id].departure);
    const depMissing = roster.filter(s => !record.students[s.id].departure);
    const retBoarded = roster.filter(s => record.students[s.id].return);
    const retMissing = roster.filter(s => !record.students[s.id].return);

    let lines = [];
    lines.push(meta.name + " -- " + formatDateDisplay(meta.date || record.date));
    lines.push("Departure: " + depBoarded.length + "/" + roster.length + " boarded");
    lines.push("Return: " + retBoarded.length + "/" + roster.length + " boarded");
    function nameWithNote(s){
      const n = record.students[s.id].note;
      return n ? (s.name + " (" + n + ")") : s.name;
    }
    if(depMissing.length){
      lines.push("");
      lines.push("Missing at Departure (" + depMissing.length + "): " + depMissing.map(nameWithNote).join(", "));
    }
    if(retMissing.length){
      lines.push("");
      lines.push("Missing at Return (" + retMissing.length + "): " + retMissing.map(nameWithNote).join(", "));
    }
    const text = lines.join("\n");

    copyTextToClipboard(text);
  });

  function copyTextToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        () => showToast("Summary copied to clipboard"),
        () => fallbackCopy(text)
      );
    }else{
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      document.execCommand("copy");
      showToast("Summary copied to clipboard");
    }catch(e){
      showToast("Copy failed -- select and copy manually");
    }
    document.body.removeChild(ta);
  }

  /* ---------- Complete trip: archive to History ---------- */
  document.getElementById("completeBtn").addEventListener("click", () => {
    if(!currentTripId) return;
    const meta = getTripMeta(currentTripId);
    const record = getTripRecord(currentTripId);
    const ok = confirm("Mark " + meta.name + " complete? Today's attendance will be saved to History, and a fresh tracker will start the next time this trip runs.");
    if(!ok) return;

    const archived = {
      archiveId: currentTripId + "-" + Date.now(),
      tripId: currentTripId,
      tripName: meta.name,
      date: meta.date || record.date,
      archivedAt: new Date().toISOString(),
      roster: STUDENTS.map(s => ({ id: s.id, name: s.name })),
      students: JSON.parse(JSON.stringify(record.students))
    };
    store.history.unshift(archived);
    store.trips[currentTripId] = freshTripRecord();
    saveStore();
    render();
    showToast(meta.name + " saved to History");
  });

  /* ---------- History overlay ---------- */
  function renderHistory(){
    const entries = store.history || [];
    if(entries.length === 0){
      historyList.innerHTML = '<div class="empty-state">No completed trips yet. Use "Complete Trip" after a run to save it here.</div>';
      return;
    }
    historyList.innerHTML = entries.map(entry => {
      const total = entry.roster.length;
      let dep = 0, ret = 0;
      entry.roster.forEach(s => {
        const rec = entry.students[s.id];
        if(rec && rec.departure) dep++;
        if(rec && rec.return) ret++;
      });
      return '<div class="history-entry">' +
        '<div class="history-entry-title">' + escapeHtml(entry.tripName) + '</div>' +
        '<div class="history-entry-meta">' + escapeHtml(formatDateDisplay(entry.date)) + ' &middot; Departure ' + dep + '/' + total + ' &middot; Return ' + ret + '/' + total + '</div>' +
        '<button class="history-download" type="button" data-archive-id="' + escapeHtml(entry.archiveId) + '">Download CSV</button>' +
      '</div>';
    }).join("");
  }

  historyBtn.addEventListener("click", () => {
    renderHistory();
    openOverlay(historyOverlay);
  });
  closeHistoryBtn.addEventListener("click", () => closeOverlay(historyOverlay));

  historyList.addEventListener("click", (e) => {
    const btn = e.target.closest(".history-download");
    if(!btn) return;
    const entry = (store.history || []).find(h => h.archiveId === btn.dataset.archiveId);
    if(!entry) return;
    const blob = buildCsvBlob(entry.roster, entry.students);
    const filename = entry.tripName.replace(/\s+/g,"-") + "-" + entry.date + "-attendance.csv";
    downloadBlob(blob, filename);
    showToast("Downloaded " + filename);
  });

  /* ---------- Init ---------- */
  applyModeColors();
  clearSearchBtn.style.display = searchTerm ? "block" : "none";
  render();

})();
</script>
</body>
</html>
